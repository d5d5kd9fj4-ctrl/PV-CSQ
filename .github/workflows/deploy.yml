name: Déploiement sur GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permissions minimales requises pour publier sur GitHub Pages via OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement actif à la fois
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5

      - name: Installation des dépendances
        run: npm install

      - name: Construction du site statique (Vite)
        run: npm run build

      - name: Téléversement de l'artefact de build
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
